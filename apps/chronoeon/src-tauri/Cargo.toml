[package]
name = "chronoeon-app"
version = "0.1.6"
description = "ChronoEon (时元) standalone application"
authors = ["ChronoEon contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chronoeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
base64 = "0.22"
libgit2-sys = "0.18"
# Vendored TLS/libgit2 keeps desktop and Android on the same sync path.
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
# Mature native codecs work on desktop and Tauri mobile; never upload raw photos.
image = { version = "0.25", features = ["webp"] }
webp = { version = "0.3", default-features = false }
zstd = "0.13"

# The global quick-capture shortcut is a desktop-only capability.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

# Android hides OpenSSL CA paths, so parse PEM roots and pass X.509 objects.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
foreign-types = "0.3"
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
tauri-plugin-sql = { path = "../../../vendor/tauri-plugin-sql" }
