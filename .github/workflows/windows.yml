name: Windows desktop build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/chronoeon
    steps:
      - name: Check out ChronoEon
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --include=optional --global=false
        working-directory: .
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/chronoeon/src-tauri -> target
      - name: Verify Windows metadata
        run: npm run verify:windows
      - name: Build frontend
        run: npm run build
      - name: Test native commands
        run: cargo test --lib --locked
        working-directory: apps/chronoeon/src-tauri
      - name: Build Windows Tauri executable and installers
        run: npm run tauri:build -- --ci
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: chronoeon-windows-bundles
          path: |
            apps/chronoeon/src-tauri/target/release/chronoeon-app.exe
            apps/chronoeon/src-tauri/target/release/bundle/nsis/*.exe
            apps/chronoeon/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/chronoeon/src-tauri -> target
      - run: npm ci --include=optional --global=false
      - run: npm run check
      - run: sudo apt-get update && sudo apt-get install -y perl build-essential
      - name: Restore existing signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/chronoeon.jks"
          echo "CHRONOEON_KEYSTORE=$HOME/.android/chronoeon.jks" >> "$GITHUB_ENV"
      - name: Build APK and Android tests
        run: |
          npm run android:apk
          cd apps/chronoeon/src-tauri/gen/android
          ./gradlew app:testArm64ReleaseUnitTest --no-daemon
        env:
          CHRONOEON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONOEON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONOEON_APK_OUTPUT: ${{ github.workspace }}/.build/android/ChronoEon-0.1.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chronoeon-android
          path: .build/android/ChronoEon-0.1.0-arm64.apk
          if-no-files-found: error
