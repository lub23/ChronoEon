name: Windows desktop build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/chronoeon
    steps:
      - name: Check out ChronoEon
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --include=optional --global=false
        working-directory: .
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify Windows metadata
        run: npm run verify:windows
      - name: Build frontend
        run: npm run build
      - name: Build Windows Tauri executable and installers
        run: npm run tauri:build -- --ci
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: chronoeon-windows-bundles
          path: |
            apps/chronoeon/src-tauri/target/release/bundle/nsis/*.exe
            apps/chronoeon/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
